name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Buildozer
        run: |
          pip install buildozer cython==0.29.36

      - name: 缓存 Android SDK/NDK
        uses: actions/cache@v3
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: 开始打包 APK
        run: buildozer -v android debug

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: music-downloader-apk
          path: bin/*.apk
          retention-days: 7
